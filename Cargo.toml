[package]
name = "mil-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"

[features]
dynamic_linking = ["bevy/dynamic_linking"]

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy itself) in debug mode
[profile.dev.package."*"]
opt-level = 3
